<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SFN Spool Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fabrication bench. 3D spool on the stage with mode + shape switches above, step/explode controls docked at the bottom; spec sheet and list on the right */
:root{
  --bg:#e6ebee; --surface:#fbfcfc; --surface-2:#eef2f4; --fg:#16212b; --muted:#566371; --line:#cfd7dd;
  --accent:#0f7c8c; --accent-ink:#ffffff; --accent-soft:#dff1f3; --warn:#b5530a; --warn-soft:#fbeedd;
  --stage-top:#f3f6f7; --stage-bot:#d3dbe0;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151a; --surface:#161d23; --surface-2:#1d252d; --fg:#e5ebef; --muted:#97a4b0; --line:#2a343d;
  --accent:#4cc3cf; --accent-ink:#06262a; --accent-soft:#16313a; --warn:#f0a04b; --warn-soft:#2d2216;
  --stage-top:#1a222a; --stage-bot:#0b0f13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151a; --surface:#161d23; --surface-2:#1d252d; --fg:#e5ebef; --muted:#97a4b0; --line:#2a343d;
  --accent:#4cc3cf; --accent-ink:#06262a; --accent-soft:#16313a; --warn:#f0a04b; --warn-soft:#2d2216;
  --stage-top:#1a222a; --stage-bot:#0b0f13; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;gap:12px;max-width:1640px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.switches{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:linear-gradient(var(--stage-top),var(--stage-bot));min-height:0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas:active{cursor:grabbing}
.hud{position:absolute;left:12px;top:12px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);pointer-events:none;display:flex;flex-direction:column;gap:2px;max-width:calc(100% - 24px)}
.hud b{color:var(--fg);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
#balloons{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.balloon{position:absolute;left:0;top:0;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:var(--surface);color:var(--fg);border:1.5px solid var(--fg);font:600 10.5px/1 var(--f-mono);display:grid;place-items:center;cursor:pointer;pointer-events:auto;opacity:.92}
.balloon.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tip{position:absolute;left:0;top:0;background:var(--fg);color:var(--bg);font-size:12px;font-weight:500;padding:4px 8px;border-radius:5px;pointer-events:none;white-space:nowrap;z-index:3}
.gauge{position:absolute;right:12px;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:2px}
.gauge strong{font-size:20px;color:var(--warn);font-variant-numeric:tabular-nums}
.controls{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.ex{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0}
.ex label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ex input{flex:1;min-width:80px;accent-color:var(--accent)}
.ex output{font-family:var(--f-mono);font-size:12px;width:38px;text-align:right;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface-2);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.steps{display:flex;gap:4px;flex-wrap:wrap;flex:1 1 300px}
.steps button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font:600 12px var(--f-mono)}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps button.done{border-color:var(--accent);color:var(--accent)}
.seg button:focus-visible,.btn:focus-visible,.row:focus-visible,.steps button:focus-visible,.balloon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow .no{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;font-weight:600}
.card h2{font-family:var(--f-disp);font-size:21px;font-weight:600;margin:6px 0 8px;line-height:1.15;text-wrap:balance}
.card p{margin:0 0 12px;max-width:65ch}
.spec{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);border-top:1px solid var(--line);margin:0}
.spec dt,.spec dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.spec dt{color:var(--muted);padding-right:10px}
.spec dd{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.chk{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.chk li{font-size:13px;padding-left:20px;position:relative}
.chk li::before{content:"";position:absolute;left:2px;top:6px;width:9px;height:9px;border:1.5px solid var(--accent);border-radius:2px}
.flag{margin-top:12px;background:var(--warn-soft);color:var(--fg);border-left:3px solid var(--warn);padding:8px 10px;font-size:12.5px;border-radius:4px}
.tag{display:inline-block;font:600 10px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:4px;white-space:nowrap}
.tF{background:var(--accent-soft);color:var(--accent)}.tB{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}.tP{background:var(--warn-soft);color:var(--warn)}
.list h3{font-family:var(--f-disp);font-size:16px;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.list h3 span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:400}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:6px;border-radius:6px;cursor:pointer;font-size:13.5px}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row .n{font-family:var(--f-mono);font-size:11px;font-weight:600;border:1.5px solid var(--fg);border-radius:999px;height:20px;display:grid;place-items:center}
.row.sel .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
@media (max-width:900px){html,body{height:auto}.app{height:auto}.work{grid-template-columns:minmax(0,1fr)}.stage{height:68vh;min-height:440px}.side{overflow:visible}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>SFN Spool Explorer</h1>
      <p>Secondary Fluid Network pipe spool: parts, fabrication steps and packing</p>
    </div>
    <div class="switches">
      <div class="seg" aria-label="Mode">
        <button id="mAsm" aria-pressed="true">Exploded assembly</button>
        <button id="mStep" aria-pressed="false">Manufacturing steps</button>
      </div>
      <div class="seg" aria-label="Spool shape">
        <button id="sS" aria-pressed="true">S-shape</button>
        <button id="sC" aria-pressed="false">C-shape</button>
      </div>
    </div>
  </header>
  <main class="work">
    <section class="stage" id="stage" aria-label="3D spool. Drag to rotate, scroll to zoom, right-drag to pan.">
      <canvas id="cv"></canvas>
      <div id="balloons"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="hud"><b id="hudT">DN150 stainless spool · S-shape</b><span id="hudS"></span><span>Drag to rotate · scroll to zoom · right-drag to pan</span></div>
      <div class="gauge" id="gauge" hidden><span>Test pressure</span><strong id="gVal">0.0 bar</strong><span id="gTxt">Filling with water</span></div>
      <div class="controls" id="ctlAsm">
        <div class="ex"><label for="explode">Explode</label><input type="range" id="explode" min="0" max="100" value="60"><output id="exOut">60%</output></div>
        <button class="btn" id="bAsm">Assemble</button><button class="btn primary" id="bExp">Explode</button><button class="btn" id="bView">Reset view</button>
      </div>
      <div class="controls" id="ctlStep" hidden>
        <button class="btn" id="bPrev">Previous</button>
        <div class="steps" id="stepBtns"></div>
        <button class="btn primary" id="bNext">Next step</button>
      </div>
    </section>
    <aside class="side">
      <div class="card" id="detail"></div>
      <div class="card list"><h3 id="listH">Spool parts <span id="listN"></span></h3><div id="list"></div></div>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
/* ---------- assumptions (replace with spool drawings) ---------- */
const P150={od:.1683,t:.0034}, P50={od:.0603,t:.00277}, R=.2286; // DN150 / DN50 Sch 10S, 1.5D long-radius elbow
const LA=1.8,LB=.9,LC=1.8,LBR=.22,STOCK=6.0,KERF=.003;
const F150={od:.2794,t:.0254,pcd:.2413,hole:.0224,n:8,hub:.1,hubL:.06}, F50={od:.1524,t:.019,pcd:.1207,hole:.019,n:4,hub:.078,hubL:.05};

/* ---------- three setup ---------- */
const stage=document.getElementById('stage'),canvas=document.getElementById('cv'),tip=document.getElementById('tip'),bl=document.getElementById('balloons');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setClearColor(0,0);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(38,1,.02,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x4d5966,1.0));
const d1=new THREE.DirectionalLight(0xffffff,.95);d1.position.set(3,6,4);scene.add(d1);
const d2=new THREE.DirectionalLight(0xdfefff,.45);d2.position.set(-4,2,-3);scene.add(d2);
const grid=new THREE.GridHelper(12,24,0x8792a0,0x8792a0);grid.material.transparent=true;grid.material.opacity=.2;scene.add(grid);
const controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=.6;controls.maxDistance=20;controls.maxPolarAngle=Math.PI*.49;
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const M={
 ss:()=>new THREE.MeshStandardMaterial({color:0xc8ced3,metalness:.55,roughness:.32,side:THREE.DoubleSide}),
 ssEl:()=>new THREE.MeshStandardMaterial({color:0xbfc7cd,metalness:.55,roughness:.36,side:THREE.DoubleSide}),
 fl:()=>new THREE.MeshStandardMaterial({color:0xaeb7be,metalness:.5,roughness:.4}),
 weld:()=>new THREE.MeshStandardMaterial({color:0x8d6b3e,metalness:.4,roughness:.5}),
 tack:()=>new THREE.MeshStandardMaterial({color:0x6b4a26,metalness:.3,roughness:.6}),
 cap:()=>new THREE.MeshStandardMaterial({color:0x2160c4,roughness:.6}),
 tagm:()=>new THREE.MeshStandardMaterial({color:0xdadfe3,metalness:.6,roughness:.3}),
 wood:()=>new THREE.MeshStandardMaterial({color:0xb7895a,roughness:.85}),
 strap:()=>new THREE.MeshStandardMaterial({color:0xe0a800,roughness:.7}),
 blind:()=>new THREE.MeshStandardMaterial({color:0xc84b31,roughness:.5,metalness:.2}),
 dark:()=>new THREE.MeshStandardMaterial({color:0x2a2f35,roughness:.5}),
 water:()=>new THREE.MeshStandardMaterial({color:0x3aa0c8,transparent:true,opacity:.22,depthWrite:false,roughness:.1}),
 off:()=>new THREE.MeshStandardMaterial({color:0xc75a4a,metalness:.4,roughness:.4,side:THREE.DoubleSide}),
 hi:()=>new THREE.MeshStandardMaterial({color:0xf5c84c,emissive:0x6b4d00,roughness:.4})
};
const Y=new THREE.Vector3(0,1,0),Z=new THREE.Vector3(0,0,1);
function qFrom(axis,dir){return new THREE.Quaternion().setFromUnitVectors(axis,dir.clone().normalize());}
function cylMesh(len,r,mat,open){const g=new THREE.CylinderGeometry(r,r,len,40,1,!!open);return new THREE.Mesh(g,mat);}
class Arc extends THREE.Curve{constructor(c,a,b){super();this.c=c;this.u=a.clone().sub(c);this.v=b.clone().sub(c);}
 getPoint(t,o=new THREE.Vector3()){const k=t*Math.PI/2;return o.copy(this.c).addScaledVector(this.u,Math.cos(k)).addScaledVector(this.v,Math.sin(k));}}
function flangeMesh(F,pipeOd,mat){const g=new THREE.Group();
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(pipeOd/2+.002,F.hub/2,F.hubL,40,1,true),mat);hub.position.y=F.hubL/2;g.add(hub);
 const s=new THREE.Shape();s.absarc(0,0,F.od/2,0,Math.PI*2,false);
 const bore=new THREE.Path();bore.absarc(0,0,pipeOd/2-.002,0,Math.PI*2,true);s.holes.push(bore);
 for(let i=0;i<F.n;i++){const a=(i+.5)/F.n*Math.PI*2,h=new THREE.Path();h.absarc(Math.cos(a)*F.pcd/2,Math.sin(a)*F.pcd/2,F.hole/2,0,Math.PI*2,true);s.holes.push(h);}
 const dg=new THREE.ExtrudeGeometry(s,{depth:F.t,bevelEnabled:false,curveSegments:24});dg.rotateX(-Math.PI/2);
 const disc=new THREE.Mesh(dg,mat);disc.position.y=F.hubL;g.add(disc);
 const rf=new THREE.Mesh(new THREE.CylinderGeometry(F.hub/2+.012,F.hub/2+.012,.002,40),mat);rf.position.y=F.hubL+F.t+.001;g.add(rf);
 return g;}
function ring(r,mat,tube){return new THREE.Mesh(new THREE.TorusGeometry(r,tube||.0065,10,48),mat);}

/* ---------- build spool ---------- */
let parts=[],extras={},center=new THREE.Vector3(),root=null,shape='S';
function build(sh){
 if(root){scene.remove(root);bl.innerHTML='';}
 root=new THREE.Group();scene.add(root);parts=[];extras={};shape=sh;
 const r1=P150.od/2,r2=P50.od/2;
 // path
 const d2=sh==='S'?new THREE.Vector3(1,0,0):new THREE.Vector3(-1,0,0);
 const pA0=new THREE.Vector3(0,0,0),dA=new THREE.Vector3(1,0,0),pA1=pA0.clone().addScaledVector(dA,LA);
 const dB=new THREE.Vector3(0,0,1),cE1=pA1.clone().addScaledVector(dB,R),pB0=cE1.clone().addScaledVector(dA,R),pB1=pB0.clone().addScaledVector(dB,LB);
 const cE2=pB1.clone().addScaledVector(d2,R),pC0=cE2.clone().addScaledVector(dB,R),pC1=pC0.clone().addScaledVector(d2,LC);
 const bb=new THREE.Box3().setFromPoints([pA0,pA1,pB0,pB1,pC0,pC1]);bb.getCenter(center);center.y=0;
 const lift=new THREE.Vector3(-center.x,.95,-center.z);root.position.copy(lift);
 const sp=(p)=>p.clone(); // local coords inside root
 function add(def,obj,home){obj.position.copy(home.p);obj.quaternion.copy(home.q||new THREE.Quaternion());root.add(obj);
  const p=Object.assign({obj,home:{p:home.p.clone(),q:(home.q||new THREE.Quaternion()).clone()},kit:null,exv:new THREE.Vector3().fromArray(def.ex||[0,0,0])},def);
  obj.traverse(o=>{if(o.isMesh)o.userData.part=p;});parts.push(p);return p;}
 const mid=(a,b)=>a.clone().add(b).multiplyScalar(.5);
 // pipes
 const pa=add({id:'A',name:'Straight pipe A',cat:'F',ex:[-.55,0,-.35]},cylMesh(LA,r1,M.ss(),true),{p:mid(pA0,pA1),q:qFrom(Y,dA)});
 const pb=add({id:'B',name:'Straight pipe B',cat:'F',ex:[sh==='S'?0:.55,.25,0]},cylMesh(LB,r1,M.ss(),true),{p:mid(pB0,pB1),q:qFrom(Y,dB)});
 const cG=new THREE.Group();const cm=cylMesh(LC,r1,M.ss(),true);cG.add(cm);
 const collar=cylMesh(.045,r2+.0015,M.ss(),true);collar.position.set(0,0,r1+.012);collar.rotation.x=Math.PI/2;cG.add(collar);
 const pc=add({id:'C',name:'Straight pipe C with branch collar',cat:'F',ex:[.55,0,.35]},cG,{p:mid(pC0,pC1),q:qFrom(Y,d2)});
 pc.collar=collar;
 // collar faces +z in group local; rotate group so collar points up (+y world): spin around pipe axis
 const spin=new THREE.Quaternion().setFromAxisAngle(Y,sh==='S'?-Math.PI/2:Math.PI/2);pc.home.q.multiply(spin);pc.obj.quaternion.copy(pc.home.q);
 // elbows
 function elbow(id,name,c,a,b,ex){const curve=new Arc(c,a.clone().sub(c),b.clone().sub(c));
  const g=new THREE.TubeGeometry(new Arc(new THREE.Vector3(),a.clone().sub(c),b.clone().sub(c)),28,r1,40,false);
  return add({id,name,cat:'B',ex},new THREE.Mesh(g,M.ssEl()),{p:c.clone()});}
 const e1=elbow('E1','Elbow 90° LR #1',cE1,pA1,pB0,[.15,.45,-.55]);
 const e2=elbow('E2','Elbow 90° LR #2',cE2,pB1,pC0,[sh==='S'?-.15:.6,.45,.55]);
 // branch
 const brBase=mid(pC0,pC1).add(new THREE.Vector3(0,r1+.035,0));
 const pbr=add({id:'BR',name:'Branch pipe DN50',cat:'F',ex:[0,.55,0]},cylMesh(LBR,r2,M.ss(),true),{p:brBase.clone().add(new THREE.Vector3(0,LBR/2,0))});
 // flanges
 const f1=add({id:'F1',name:'Weld-neck flange DN150 (inlet)',cat:'B',ex:[-.6,0,0]},flangeMesh(F150,P150.od,M.fl()),{p:pA0.clone(),q:qFrom(Y,dA.clone().negate())});
 const f2=add({id:'F2',name:'Weld-neck flange DN150 (outlet)',cat:'B',ex:[d2.x*.6,0,0]},flangeMesh(F150,P150.od,M.fl()),{p:pC1.clone(),q:qFrom(Y,d2)});
 const f3=add({id:'F3',name:'Weld-neck flange DN50 (branch)',cat:'B',ex:[0,.9,0]},flangeMesh(F50,P50.od,M.fl()),{p:brBase.clone().add(new THREE.Vector3(0,LBR,0)),q:new THREE.Quaternion()});
 // welds (rings) and tacks
 const joints=[[pA0,dA,r1],[pA1,dA,r1],[pB0,dB,r1],[pB1,dB,r1],[pC0,d2,r1],[pC1,d2,r1],[brBase,Y,r2],[brBase.clone().add(new THREE.Vector3(0,LBR,0)),Y,r2]];
 const wG=new THREE.Group(),tG=new THREE.Group();const wm=M.weld(),tm=M.tack();
 joints.forEach(([p,dir,r])=>{const w=ring(r+.0015,wm,r>.05?.0065:.0045);w.position.copy(p);w.quaternion.copy(qFrom(Z,dir));wG.add(w);
  const q=qFrom(Z,dir);for(let i=0;i<4;i++){const a=i*Math.PI/2+.4;const s=new THREE.Mesh(new THREE.SphereGeometry(r>.05?.011:.008,10,8),tm);
   s.position.copy(new THREE.Vector3(Math.cos(a)*(r+.002),Math.sin(a)*(r+.002),0).applyQuaternion(q).add(p));tG.add(s);}});
