P({name:"Base frame & casing",area:"ACC-01 · Base frame & casing",enclosure:true,ex:[0, -0.6, 0],fn:"Base frame and side casing panels.",spec:[["Material", "Galvanised steel, powder coated"]],bom:[["ACC-01-01", "Base frame", "M"], ["ACC-01-02", "Casing panels", "M"]]},g=>{box(g,9,.2,2.3,'steelDark',0,.1,0,{e:1});box(g,9,.9,.02,'steel',0,.65,1.15);box(g,9,.9,.02,'steel',0,.65,-1.15);});
P({name:"Compressors",area:"ACC-02 · Compressors",ex:[0, 0, 1.5],fn:"Screw or scroll compressors.",spec:[["Qty", "2 (assumed)"]],bom:[["ACC-02-01", "Compressor", "B"]]},g=>{[-3,-1.5].forEach(x=>cyl(g,.35,1.1,'blue',x,.6,0,'x'));});

P({name:"Control panel & refrigerant piping",area:"ACC-06 · Control panel & refrigerant piping",ex:[4.8, 0, 0],fn:"Controller, starters and refrigerant circuit.",spec:[["Refrigerant", "Per design"]],bom:[["ACC-06-01", "Control / starter panel", "B"], ["ACC-06-02", "Refrigerant piping set", "B"], ["ACC-06-03", "Refrigerant charge", "C"]]},g=>{box(g,.6,1.4,.8,'steel',4.2,.9,0,{e:1});});

(function(){

const P=(d,f)=>addPart(m,d,f);
P({name:"Base frame & fuel tank",area:"GEN-01 · Base frame & fuel tank",ex:[0, -0.8, 0],fn:"Base frame with integral day tank.",spec:[["Material", "Steel plate"]],bom:[["GEN-01-01", "Base frame with fuel tank", "M"]]},g=>{box(g,11,.5,2.6,'steelDark',0,.25,0,{e:1});});
P({name:"Engine",area:"GEN-02 · Engine",ex:[0, 0, 1.6],fn:"Diesel engine.",spec:[["Rating", "Per kVA (assumed 2.5–3 MVA)"]],bom:[["GEN-02-01", "Diesel engine", "B"]]},g=>{box(g,4,1.8,1.6,'green',-1.5,1.4,0,{e:1});});
P({name:"Alternator",area:"GEN-03 · Alternator",ex:[0, 0, -1.6],fn:"Brushless alternator.",spec:[["Voltage", "415 V / 11 kV (assumed)"]],bom:[["GEN-03-01", "Alternator", "B"]]},g=>{cyl(g,.8,2.2,'blue',1.6,1.3,0,'x');});
P({name:"Radiator",area:"GEN-04 · Radiator",ex:[-1.2, 0, 0],fn:"Engine-cooling radiator.",spec:[["Type", "Remote or engine-mounted"]],bom:[["GEN-04-01", "Radiator", "B"]]},g=>{box(g,.4,2.2,2.2,'black',-4.3,1.6,0,{e:1});});
P({name:"Acoustic canopy",area:"GEN-05 · Acoustic canopy",enclosure:true,ex:[0, 3.6, 0],fn:"Containerised acoustic enclosure.",spec:[["Material", "CRCA 2.0 mm + acoustic foam"], ["Noise", "75 dB(A) at 1 m (assumed)"]],bom:[["GEN-05-01", "Canopy panels", "M"], ["GEN-05-02", "Acoustic insulation", "B"]]},g=>{box(g,12,3,3,'canopy',0,2.0,0,{e:1});});
P({name:"Control panel, silencer & batteries",area:"GEN-06 · Control panel, silencer & batteries",ex:[1.2, 0.6, 0],fn:"AMF panel, exhaust silencer and starting batteries.",spec:[["Panel", "AMF / synchronising"]],bom:[["GEN-06-01", "AMF control panel", "B"], ["GEN-06-02", "Exhaust silencer", "B"], ["GEN-06-03", "Starting batteries", "B"]]},g=>{box(g,.8,1.6,.6,'steel',4.5,1.3,.8,{e:1});cyl(g,.35,2,'steelDark',1,3.8,0,'x');});

[['mv','MV · 33 kV switchboard'],['lv','LV · 4000 A main board'],['pdu','PDU'],['rpp','RPP / PDC']].forEach(([k,t])=>{models[k].site='b34';models[k].tab=t;});
/* ---------- scene ---------- */
const stage=document.getElementById('stage'),canvas=document.getElementById('cv'),tip=document.getElementById('tip'),bl=document.getElementById('balloons');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(38,1,.05,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x56606c,.95));
const d1=new THREE.DirectionalLight(0xffffff,.85);d1.position.set(4,6,5);scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,.35);d2.position.set(-5,3,-4);scene.add(d2);
const grid=new THREE.GridHelper(14,28,0x8892a0,0x8892a0);grid.material.transparent=true;grid.material.opacity=.22;grid.position.y=-1.05;scene.add(grid);
const controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=1.2;controls.maxDistance=22;controls.autoRotateSpeed=.8;

const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=null,sel=null,hov=null,t=.65,tT=.65,xray=false,showB=true,isolate=false,cmode=false;
const SHEET=new Set(['steel','steelDark','galv','alu']);const COL_M=0x3f9a5a,COL_B=0x4f7fc4;
const ACC=0xf08c00;

Object.values(models).forEach(m=>{scene.add(m.root);m.root.visible=false;if(m.scale)m.root.scale.fromArray(m.scale);
 m.parts.forEach(p=>{const b=document.createElement('button');b.className='balloon';b.textContent=p.no;b.setAttribute('aria-label','Item '+p.no+': '+p.name);
  b.addEventListener('click',e=>{e.stopPropagation();select(p);});b.addEventListener('pointerenter',()=>setHover(p));b.addEventListener('pointerleave',()=>setHover(null));
  b.hidden=true;bl.appendChild(b);p.el=b;});});

function placeParts(){if(!cur)return;cur.parts.forEach(p=>p.obj.position.copy(p.exv).multiplyScalar(t));}
function applyVisuals(){if(!cur)return;cur.parts.forEach(p=>{
 p.obj.visible=!(isolate&&sel&&p!==sel);const ghost=xray&&p.enclosure&&p!==sel;
 p.mats.forEach(e=>{const op=e.line?(ghost?.2:e.base):(ghost?.08:e.base);const tr=op<.999;
  if(e.m.transparent!==tr){e.m.transparent=tr;e.m.needsUpdate=true;}e.m.opacity=op;
  if(!e.line){e.m.depthWrite=op>.5;const mk=p.cat==='M'||(p.cat==='MB'&&SHEET.has(e.m.userData.k));e.m.color.setHex(cmode?(mk?COL_M:COL_B):e.m.userData.baseCol);if(p===sel||p===hov){e.m.emissive.setHex(ACC);e.m.emissiveIntensity=p===sel?.5:.28;}else{e.m.emissive.setHex(e.m.userData.baseEm);e.m.emissiveIntensity=1;}}});
 p.el.classList.toggle('sel',p===sel);});
 document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',sel&&+r.dataset.no===sel.no));}
function setHover(p){if(p===hov)return;hov=p;applyVisuals();}

function frame(){const m=cur;const asp=camera.aspect||1;const d=m.dist*Math.max(1,1.25/asp);
 controls.target.copy(m.target);camera.position.copy(m.target).addScaledVector(m.dir.clone().normalize(),d);camera.updateProjectionMatrix();controls.update();}
function setModel(k){if(!models[k])k='mv';if(cur)cur.root.visible=false;if(cur)cur.parts.forEach(p=>p.el.hidden=true);
 cur=models[k];cur.root.visible=true;sel=null;hov=null;isolate=false;
 renderTabs(cur.site);document.querySelectorAll('#prodSeg button').forEach(b=>b.setAttribute('aria-selected',b.dataset.model===k?'true':'false'));document.querySelectorAll('#siteSeg button').forEach(b=>b.setAttribute('aria-selected',b.dataset.site===cur.site?'true':'false'));
 document.getElementById('hudTitle').textContent=cur.title;document.getElementById('hudRating').textContent=cur.rating;document.getElementById('hudSize').textContent=cur.size;
 placeParts();applyVisuals();renderBOM();renderDetail();frame();
 try{if(location.hash!=='#'+k)history.replaceState(null,'','#'+k);}catch(e){}}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const TAG={M:'Make',B:'Buy',MB:'Make + Buy'};
function renderBOM(){const groups={};cur.parts.forEach(p=>{(groups[p.area]=groups[p.area]||[]).push(p);});
 document.getElementById('bomCount').textContent=cur.parts.length+' parts · '+cur.parts.reduce((a,p)=>a+p.bom.length,0)+' BOM lines';
 let h='';Object.keys(groups).forEach(a=>{h+='<div class="grp">'+esc(a)+'</div>';groups[a].forEach(p=>{h+='<button class="row" data-no="'+p.no+'"><span class="n">'+p.no+'</span><span>'+esc(p.name)+'</span><span class="tag t'+p.cat+'">'+TAG[p.cat]+'</span></button>';});});
 const el=document.getElementById('bom');el.innerHTML=h;
 el.querySelectorAll('.row').forEach(r=>{const p=cur.parts[+r.dataset.no-1];r.addEventListener('click',()=>select(p===sel?null:p));
  r.addEventListener('pointerenter',()=>setHover(p));r.addEventListener('pointerleave',()=>setHover(null));});}
function renderDetail(){const el=document.getElementById('detail');
 if(!sel){el.innerHTML='<div class="eyebrow">Overview · '+cur.parts.length+' components</div><h2>'+esc(cur.title)+'</h2><p>'+esc(cur.overview)+'</p>'+
  '<dl class="spec"><dt>Ratings</dt><dd>'+esc(cur.rating)+'</dd><dt>Typical size</dt><dd>'+esc(cur.size)+'</dd></dl>'+
  '<div class="legend"><span><i style="background:var(--ph-r)"></i>R phase</span><span><i style="background:var(--ph-y)"></i>Y phase</span><span><i style="background:var(--ph-b)"></i>B phase</span>'+(cur.key==='lv'?'<span><i style="background:#222428"></i>Neutral</span>':'')+'</div>'+
  '<p class="note">Click a part, a numbered balloon or a row below to see its function and typical rating. Ratings and sizes are assumptions from the BOM workbook and will be replaced once GA / SLD drawings arrive. Turn on Colour by Make / Buy to see what you fabricate versus purchase.</p>';return;}
 const p=sel;let dl='';p.spec.forEach(s=>{dl+='<dt>'+esc(s[0])+'</dt><dd>'+esc(s[1])+'</dd>';});
 let bl='';p.bom.forEach(b=>{const c=b[2]==='M'?'M':(b[2]==='C'?'C':'B');bl+='<li><code>'+esc(b[0])+'</code><span>'+esc(b[1])+'</span><span class="tag t'+c+'">'+({M:'Make',B:'Buy',C:'Consumable'})[c]+'</span></li>';});
 el.innerHTML='<div class="eyebrow"><span class="no">'+p.no+'</span>'+esc(p.area)+'</div><h2>'+esc(p.name)+' <span class="tag t'+p.cat+'">'+TAG[p.cat]+'</span></h2><p>'+esc(p.fn)+'</p><dl class="spec">'+dl+'</dl>'+
  '<div class="bl-h">BOM lines ('+p.bom.length+')</div><ul class="bl">'+bl+'</ul>'+
  '<div class="acts"><button class="btn primary" id="bIso">'+(isolate?'Show all parts':'Show only this part')+'</button><button class="btn" id="bClr">Back to overview</button></div>';
 document.getElementById('bIso').onclick=()=>{isolate=!isolate;applyVisuals();renderDetail();};
 document.getElementById('bClr').onclick=()=>select(null);}
function select(p){sel=p;if(!p)isolate=false;applyVisuals();renderDetail();
 if(p){const r=document.querySelector('.row[data-no="'+p.no+'"]');if(r&&r.scrollIntoView&&window.innerWidth>880)r.scrollIntoView({block:'nearest'});}}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(cx,cy){const r=canvas.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
 const hits=ray.intersectObjects(cur.root.children,true);for(const h of hits){const p=h.object.userData.part;if(!p||!p.obj.visible)continue;if(xray&&p.enclosure&&p!==sel)continue;return p;}return null;}
let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6){select(pick(e.clientX,e.clientY));}down=null;});
canvas.addEventListener('pointermove',e=>{if(e.buttons){tip.hidden=true;return;}const p=pick(e.clientX,e.clientY);setHover(p);
 if(p){const r=stage.getBoundingClientRect();tip.textContent=p.no+' · '+p.name;tip.hidden=false;
  let x=e.clientX-r.left+14,y=e.clientY-r.top+14;if(x+tip.offsetWidth>r.width-8)x=e.clientX-r.left-tip.offsetWidth-10;tip.style.transform='translate('+x+'px,'+y+'px)';}else tip.hidden=true;});
canvas.addEventListener('pointerleave',()=>{tip.hidden=true;setHover(null);});

/* ---------- controls ---------- */
const sl=document.getElementById('explode'),out=document.getElementById('exOut');
function setT(v,instant){tT=Math.max(0,Math.min(1,v));if(instant||reduce)t=tT;sl.value=Math.round(tT*100);out.textContent=Math.round(tT*100)+'%';}
sl.addEventListener('input',()=>{setT(sl.value/100,true);placeParts();});
document.getElementById('bAssemble').onclick=()=>setT(0);
document.getElementById('bExplode').onclick=()=>setT(1);
document.getElementById('bReset').onclick=()=>frame();
function chip(id,get,set){const b=document.getElementById(id);b.onclick=()=>{set(!get());b.setAttribute('aria-pressed',get()?'true':'false');};}
chip('cXray',()=>xray,v=>{xray=v;applyVisuals();});
chip('cBalloons',()=>showB,v=>{showB=v;});
chip('cRotate',()=>controls.autoRotate,v=>{controls.autoRotate=v;});
chip('cMake',()=>cmode,v=>{cmode=v;document.getElementById('mkLegend').hidden=!v;applyVisuals();});
let tabSite=null;
function renderTabs(site){if(tabSite===site)return;tabSite=site;const box=document.getElementById('prodSeg');box.innerHTML='';
 Object.values(models).filter(m=>m.site===site).forEach(m=>{const b=document.createElement('button');b.setAttribute('role','tab');b.dataset.model=m.key;b.textContent=m.tab;b.addEventListener('click',()=>setModel(m.key));box.appendChild(b);});}
document.querySelectorAll('#siteSeg button').forEach(b=>b.addEventListener('click',()=>{if(cur&&cur.site===b.dataset.site)return;const f=Object.values(models).find(m=>m.site===b.dataset.site);if(f)setModel(f.key);}));
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(models[k]&&cur&&cur.key!==k)setModel(k);});
window.addEventListener('keydown',e=>{if(e.key==='Escape')select(null);});

/* ---------- resize & loop ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);
resize();
setModel(models[location.hash.slice(1)]?location.hash.slice(1):'mv');
setT(.65,true);placeParts();

const v=new THREE.Vector3();
function tick(){requestAnimationFrame(tick);
 if(t!==tT){t+=(tT-t)*.12;if(Math.abs(tT-t)<.002)t=tT;placeParts();}
 controls.update();renderer.render(scene,camera);
 const w=stage.clientWidth,h=stage.clientHeight;
 cur.parts.forEach(p=>{if(!showB||!p.obj.visible){p.el.hidden=true;return;}v.copy(p.center).addScaledVector(p.exv,t).applyMatrix4(cur.root.matrixWorld).project(camera);
  if(v.z>1||v.x<-1.05||v.x>1.05||v.y<-1.05||v.y>1.05){p.el.hidden=true;return;}
  p.el.hidden=false;p.el.style.transform='translate('+((v.x+1)/2*w-11).toFixed(1)+'px,'+((1-v.y)/2*h-11).toFixed(1)+'px)';});}
tick();
})();
</script>
